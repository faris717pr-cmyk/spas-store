<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>SPAS Store</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
      text-align: center;
    }
    header {
      padding: 20px;
      font-size: 30px;
      font-weight: bold;
      background: #020617;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 30px;
    }
    .card {
      background: #020617;
      padding: 20px;
      border-radius: 12px;
    }
    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<header><meta name="google-site-verification" content="googleb4087ee43c37fa78" /></header>

<div class="products">
  <div class="card">
    <h3>100 روبوكس</h3>
    <p>تسليم سريع</p>
    <button onclick="location.href='https://discord.gg/'">شراء</button>
  </div>

  <div class="card">
    <h3>رتبة VIP</h3>
    <p>داخل السيرفر</p>
    <button onclick="location.href='https://discord.gg/'">شراء</button>
  </div>

  <div class="card">
    <h3>Gamepass</h3>
    <p>روبلكس</p>
    <button onclick="location.href='https://discord.gg/'">شراء</button>
  </div>
</div>

</body>
</html>
